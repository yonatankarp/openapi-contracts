name: Release

# Triggered by pushing a tag like `v0.1.0`. The tag must match the version you
# want to publish; the workflow strips the leading `v` and passes it as -Pversion.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   - GRADLE_PUBLISH_KEY    : Gradle Plugin Portal API key
#   - GRADLE_PUBLISH_SECRET : Gradle Plugin Portal API secret
# Get them at https://plugins.gradle.org/u/<your-account> -> API keys.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Resolve version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish to Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: >
          ./gradlew publishPlugins
          -Pversion=${RELEASE_VERSION}
          -Pgradle.publish.key=${GRADLE_PUBLISH_KEY}
          -Pgradle.publish.secret=${GRADLE_PUBLISH_SECRET}
          --no-daemon
